{% extends 'base.html' %}

{% block title %}Contraseña Cambiada - ObraFit{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-br from-primary-50 to-mint-50 py-20">
  <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-10 text-center">
      
      <!-- Icono de éxito -->
      <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6 animate-bounce">
        <i class="fas fa-check-circle text-green-600 text-4xl"></i>
      </div>

      <h1 class="text-3xl font-display font-bold text-warm-900 mb-4">
        ¡Contraseña Cambiada!
      </h1>
      
      <p class="text-lg text-warm-700 mb-8">
        Tu contraseña ha sido cambiada exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.
      </p>

      <a href="{% url 'usuarios:login' %}" class="inline-block bg-gradient-to-r from-primary-500 to-mint-500 text-white px-10 py-4 rounded-full font-bold text-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
      </a>

      <div class="mt-8 text-warm-600">
        <i class="fas fa-shield-alt text-green-600 mr-2"></i>
        Tu cuenta está protegida
      </div>
    </div>
  </div>
</section>
{% endblock %}
