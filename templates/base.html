<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ObraFit - Alimentación para Trabajadores{% endblock %}</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Estilos propios -->
  {% load static %}
  <link href="{% static 'css/main.css' %}" rel="stylesheet">

  <!-- Estilos extra -->
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">
        <i class="fas fa-hard-hat me-2"></i>ObraFit
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}"><i class="fas fa-home me-1"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-utensils me-1"></i> Recetas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-lightbulb me-1"></i> Consejos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-envelope me-1"></i> Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido dinámico -->
  <main class="container my-4">
    {% block content %}
    <!-- Aquí van las vistas específicas -->
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container">
      <div class="row py-3 align-items-center">
        <div class="col-md-4 mb-3 mb-md-0">
          <h5 class="mb-2"><i class="fas fa-hard-hat me-2"></i>ObraFit</h5>
          <p class="small m-0">Alimentación para la construcción</p>
        </div>
        <div class="col-md-4 mb-3 mb-md-0 text-center">
          <div class="social-icons">
            <a href="#" class="text-light mx-1"><i class="fab fa-facebook fa-lg"></i></a>
            <a href="#" class="text-light mx-1"><i class="fab fa-instagram fa-lg"></i></a>
            <a href="#" class="text-light mx-1"><i class="fab fa-youtube fa-lg"></i></a>
          </div>
        </div>
        <div class="col-md-4 text-md-end">
          <p class="small m-0">© 2025 · Plataforma de Bienestar Alimenticio</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% load static %}
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
